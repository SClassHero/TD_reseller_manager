{% extends "base.html" %}

{% block title %}Create Return - Inventory Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Return</h1>
</div>

<form id="return-form" method="POST" action="{{ url_for('returns.create_return') }}" class="card">
    <div class="card-body">
        <!-- Step 1: Select Order -->
        <div class="form-section">
            <h3>Step 1: Select Order</h3>

            <div class="form-group">
                <label for="order_id">Order *</label>
                <select id="order_id"
                        name="order_id"
                        class="form-input"
                        required>
                    <option value="">-- Select an Order --</option>
                    {% for order in orders %}
                        <option value="{{ order['id'] }}">
                            {{ order['order_code'] }} - {{ order['customer_name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Step 2: Select Items to Return (loaded by HTMX) -->
        <div id="order-items-section">
        </div>

        <!-- Return Reason -->
        <div class="form-section">
            <h3>Return Details</h3>

            <div class="form-group">
                <label for="return_reason">Return Reason</label>
                <textarea id="return_reason"
                          name="return_reason"
                          class="form-input"
                          rows="4"
                          placeholder="Explain the reason for this return..."></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="restore_inventory" value="on">
                    Restore inventory quantities for returned items
                </label>
                <p class="text-muted" style="font-size: 0.9em; margin-top: 0.5em;">
                    Check this to automatically add returned quantities back to inventory
                </p>
            </div>
        </div>
    </div>

    <!-- Form Actions -->
    <div class="card-body" style="border-top: 1px solid #e2e8f0; padding-top: 1.5em;">
        <div class="form-actions">
            <a href="{{ url_for('returns.returns_list') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary" id="submit-btn">Create Return</button>
        </div>
    </div>
</form>

<script>
// Load order items via HTMX when order is selected
const orderSelect = document.getElementById('order_id');
orderSelect.addEventListener('change', function() {
    const orderId = this.value;
    const target = document.getElementById('order-items-section');

    if (!orderId) {
        target.innerHTML = '';
        return;
    }

    // Use htmx.ajax to load content — this properly processes <script> tags
    htmx.ajax('GET', '/returns/new/items/' + orderId, {target: target, swap: 'innerHTML'});
});
</script>
{% endblock %}
