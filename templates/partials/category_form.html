<div class="modal active">
    <div class="modal-content">
        <div class="modal-header">
            <h3>{% if category %}Edit{% else %}Add{% endif %} Category</h3>
            <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
        </div>

        <form method="POST" action="{% if category %}{{ url_for('categories.update_category', id=category.id) }}{% else %}{{ url_for('categories.create_category') }}{% endif %}">
            {% if category %}
                <input type="hidden" name="category_id" value="{{ category.id }}">
            {% endif %}

            <div class="form-group">
                <label for="name">Category Name *</label>
                <input type="text"
                       id="name"
                       name="name"
                       class="form-input"
                       value="{{ category.name if category else '' }}"
                       required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          name="description"
                          class="form-input"
                          rows="3">{{ category.description if category else '' }}</textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal').remove()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
