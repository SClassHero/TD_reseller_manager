<div class="modal active">
    <div class="modal-content">
        <div class="modal-header">
            <h3>{% if category %}{{ _('Edit Category') }}{% else %}{{ _('Add Category') }}{% endif %}</h3>
            <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
        </div>

        <form method="POST" action="{% if category %}{{ url_for('categories.update_category', id=category.id) }}{% else %}{{ url_for('categories.create_category') }}{% endif %}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if category %}
                <input type="hidden" name="category_id" value="{{ category.id }}">
            {% endif %}

            <div class="modal-body">
                <div class="form-group">
                    <label for="name">{{ _('Category Name *') }}</label>
                    <input type="text"
                           id="name"
                           name="name"
                           class="form-input"
                           value="{{ category.name if category else '' }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">{{ _('Description') }}</label>
                    <textarea id="description"
                              name="description"
                              class="form-input"
                              rows="3">{{ category.description if category else '' }}</textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal').remove()">{{ _('Cancel') }}</button>
                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            </div>
        </form>
    </div>
</div>
