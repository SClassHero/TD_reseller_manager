<div class="modal active">
    <div class="modal-content">
        <div class="modal-header">
            <h3>{{ _('Add Inventory Intake') }}</h3>
            <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
        </div>

        <form method="POST" action="{{ url_for('inventory.create_intake') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="modal-body">
                <div class="form-group">
                    <label for="product_id">{{ _('Product *') }}</label>
                    <select id="product_id" name="product_id" class="form-input" required
                            onchange="prefillCost(this)">
                        <option value="">-- {{ _('Select Product') }} --</option>
                        {% for product in products %}
                            <option value="{{ product['id'] }}"
                                    data-cost="{{ product['cost_price'] or '' }}">
                                [{{ product['product_code'] }}] {{ product['name'] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">
                        {{ _('Quantity *') }}
                        <small class="text-muted" style="font-weight:normal;">
                            {{ _('use negative for pre-orders / backorders not yet in warehouse') }}
                        </small>
                    </label>
                    <input type="number"
                           id="quantity"
                           name="quantity"
                           class="form-input"
                           placeholder="{{ _('e.g. 10 or -5 for backorder') }}"
                           required>
                </div>

                <div class="modal-field-grid">
                    <div class="form-group">
                        <label for="cost_price">{{ _('Cost Price per Unit') }} <small class="text-muted" style="font-weight:normal;">({{ _('in currency below') }})</small></label>
                        <input type="number"
                               id="cost_price"
                               name="cost_price"
                               class="form-input"
                               min="0"
                               step="0.01"
                               placeholder="0">
                    </div>

                    <div class="form-group">
                        <label for="shipping_cost">
                            {{ _('Shipping Cost to Warehouse') }}
                            <small class="text-muted" style="font-weight:normal;">{{ _('total, not per unit') }}</small>
                        </label>
                        <input type="number"
                               id="shipping_cost"
                               name="shipping_cost"
                               class="form-input"
                               min="0"
                               step="0.01"
                               placeholder="0"
                               value="0">
                    </div>
                </div>

                <div class="modal-field-grid">
                    <div class="form-group">
                        <label for="currency">{{ _('Currency') }}</label>
                        <select id="currency" name="currency" class="form-input">
                            <option value="VND" selected>VND</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="intake_date">{{ _('Intake Date') }}</label>
                        <input type="date"
                               id="intake_date"
                               name="intake_date"
                               class="form-input">
                        <small id="intake-date-warn" style="color:#f59e0b; display:none; margin-top:4px;">
                            {{ _('Date is more than 30 days in the past. This lot will be inserted earlier in the FIFO queue.') }}
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">{{ _('Notes') }}</label>
                    <textarea id="notes" name="notes" class="form-input" rows="2" placeholder="{{ _('Optional notes') }}"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal').remove()">{{ _('Cancel') }}</button>
                <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            </div>
        </form>
    </div>
</div>

<script>
function prefillCost(select) {
    const cost = select.selectedOptions[0]?.dataset.cost;
    const costField = document.getElementById('cost_price');
    // Only pre-fill if the cost field is still empty or unchanged from a previous pre-fill
    if (cost && costField && (!costField.value || costField.dataset.prefilled === 'true')) {
        costField.value = cost;
        costField.dataset.prefilled = 'true';
    }
}
// Allow user edits to break the auto-fill link
document.addEventListener('DOMContentLoaded', function() {
    const costField = document.getElementById('cost_price');
    if (costField) {
        costField.addEventListener('input', function() {
            this.dataset.prefilled = 'false';
        });
    }

    // Warn when intake_date is more than 30 days in the past (FIFO ordering concern)
    const dateField = document.getElementById('intake_date');
    const dateWarn  = document.getElementById('intake-date-warn');
    if (dateField && dateWarn) {
        function checkIntakeDate() {
            if (!dateField.value) { dateWarn.style.display = 'none'; return; }
            const selected  = new Date(dateField.value);
            const threshold = new Date();
            threshold.setDate(threshold.getDate() - 30);
            dateWarn.style.display = selected < threshold ? 'block' : 'none';
        }
        dateField.addEventListener('change', checkIntakeDate);
        checkIntakeDate();
    }
});
</script>
