<table class="table mobile-card-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Product Count</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
            <tr>
                <td data-label="Name"><strong>{{ category.name }}</strong></td>
                <td data-label="Description">{{ category.description or '-' }}</td>
                <td data-label="Product Count"><span class="badge">{{ category.product_count|number }}</span></td>
                <td data-label="Actions">
                    <div class="action-buttons">
                        {% if is_admin %}
                            <button class="btn btn-sm btn-outline"
                                    hx-get="{{ url_for('categories.edit_category', id=category.id) }}"
                                    hx-target="#modal-container">
                                Edit
                            </button>
                            <button class="btn btn-sm btn-danger"
                                    hx-post="{{ url_for('categories.delete_category', id=category.id) }}"
                                    hx-confirm="Delete this category? Products in this category will not be deleted.">
                                Delete
                            </button>
                        {% else %}
                            <span class="text-muted">View only</span>
                        {% endif %}
                    </div>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
