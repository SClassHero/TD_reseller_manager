{% extends "base.html" %}

{% block title %}Categories - Inventory Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Categories</h1>
    <button class="btn btn-primary" hx-get="{{ url_for('categories.new_category') }}" hx-target="#modal-container">
        + Add Category
    </button>
</div>

<div class="card">
    <div class="card-body">
        {% if categories %}
            <div class="table-wrapper">
                {% include 'partials/categories_table.html' %}
            </div>
        {% else %}
            <p class="text-muted">No categories found.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
